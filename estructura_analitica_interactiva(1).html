// ── CONSTRUIR ARBRE ───────────────────────────────────────────────────────
function buildTree(data) {
  const root = { name: "FUNDACIÓ\nONCOLLIGA", children: [] };
  const catMap = {};

  data.forEach(d => {
    if (!catMap[d.cat]) {
      catMap[d.cat] = { name: d.cat, categoria: d.cat, children: [], _children: null };
      root.children.push(catMap[d.cat]);
    }
    let catNode = catMap[d.cat];
    let grupNode = catNode.children.find(g => g.name === d.grup);
    if (!grupNode) {
      grupNode = { name: d.grup, categoria: d.cat, children: [], _children: null };
      catNode.children.push(grupNode);
    }
    grupNode.children.push({ name: d.subgrup, categoria: d.cat, children: null });
  });
  return root;
}

const treeData = buildTree(rawData);

const legDiv = document.getElementById('legend');

  legDiv.appendChild(item);

// ── D3 TREE ───────────────────────────────────────────────────────────────
const margin = { top: 30, right: 180, bottom: 30, left: 160 };
const width  = 1600 - margin.left - margin.right;
const height = 2400 - margin.top  - margin.bottom;

const svg = d3.select("#tree-svg")
  .attr("width",  width  + margin.left + margin.right)
  .attr("height", height + margin.top  + margin.bottom);

const zoomG = svg.append("g")
  .attr("transform", `translate(${margin.left},${margin.top})`);

svg.call(d3.zoom()
  .scaleExtent([0.2, 3])
  .on("zoom", e => zoomG.attr("transform", e.transform))
);

const gLink = zoomG.append("g").attr("class","links");
const gNode = zoomG.append("g").attr("class","nodes");

const treeFn = d3.tree().size([height, width]);
let root = d3.hierarchy(treeData, d => d.children);
root.x0 = height / 2;
root.y0 = 0;

// Inicia amb categories expandides però grups contrets
root.children.forEach(cat => {
  cat.children && cat.children.forEach(grp => {
    if (grp.children) { grp._children = grp.children; grp.children = null; }
  });
});

const tooltip = document.getElementById('tooltip');

function nodeColor(d) {
  if (d.depth === 0) return "#1F2D3D";
  const cat = d.data.categoria || d.data.name;
  return COLORS[cat] || "#999";
}

function update(source) {
  const nodes = treeFn(root).descendants();
  const links = treeFn(root).links();

  // ── Nodes ──
  const node = gNode.selectAll("g.node")
    .data(nodes, d => d.data.name + d.depth);

  const nodeEnter = node.enter().append("g")
    .attr("class","node")
    .attr("transform", d => `translate(${source.y0},${source.x0})`)
    .on("click", (e, d) => { toggle(d); update(d); })
    .on("mouseover", (e, d) => {
      const n = d.data.children ? d.data.children.length : (d.data._children ? d.data._children.length : 0);
      tooltip.style.opacity = 1;
      tooltip.innerHTML = `<strong>${d.data.name}</strong>${n ? `<br>Fills: ${n}` : ''}${d.data.categoria ? `<br>Categoria: ${d.data.categoria}` : ''}`;
    })
    .on("mousemove", e => {
      tooltip.style.left  = (e.clientX + 14) + "px";
      tooltip.style.top   = (e.clientY - 10) + "px";
    })
    .on("mouseout", () => { tooltip.style.opacity = 0; });

  nodeEnter.append("circle")
    .attr("r", 0)
    .attr("fill",   d => d._children ? nodeColor(d) : (d.children ? nodeColor(d) : "white"))
    .attr("stroke", d => nodeColor(d));

  nodeEnter.append("text")
    .attr("dy", "0.35em")
    .attr("x",  d => d.children || d._children ? -12 : 12)
    .attr("text-anchor", d => d.children || d._children ? "end" : "start")
    .text(d => d.data.name)
    .attr("fill", d => d.depth === 0 ? "white" : "#1F2D3D")
    .attr("font-weight", d => d.depth <= 1 ? "700" : "400");

  const nodeUpdate = nodeEnter.merge(node);
  nodeUpdate.transition().duration(400)
    .attr("transform", d => `translate(${d.y},${d.x})`);

  nodeUpdate.select("circle").transition().duration(400)
    .attr("r", d => d.depth === 0 ? 18 : d.depth === 1 ? 12 : d.depth === 2 ? 8 : 5)
    .attr("fill", d => d._children ? nodeColor(d) : (d.children ? adjustColor(nodeColor(d),0.3) : "white"))
    .attr("stroke", d => nodeColor(d));

  nodeUpdate.select("text")
    .attr("x",  d => d.children || d._children ? -14 : 14)
    .attr("text-anchor", d => d.children || d._children ? "end" : "start")
    .attr("font-weight", d => d.depth <= 1 ? "700" : "400");

  node.exit().transition().duration(400)
    .attr("transform", d => `translate(${source.y},${source.x})`)
    .remove()
    .select("circle").attr("r", 0);

  // ── Links ──
  const link = gLink.selectAll("path.link")
    .data(links, d => d.target.data.name + d.target.depth);

  const diagonal = d3.linkHorizontal().x(d => d.y).y(d => d.x);

  link.enter().insert("path", "g")
    .attr("class","link")
    .attr("d", () => {
      const o = { x: source.x0, y: source.y0 };
      return diagonal({ source: o, target: o });
    })
    .attr("stroke", d => COLORS[d.target.data.categoria] || "#C8D6DF")
    .merge(link)
    .transition().duration(400)
    .attr("d", diagonal)
    .attr("stroke", d => COLORS[d.target.data.categoria] || "#C8D6DF");

  link.exit().transition().duration(400)
    .attr("d", () => {
      const o = { x: source.x, y: source.y };
      return diagonal({ source: o, target: o });
    }).remove();

  nodes.forEach(d => { d.x0 = d.x; d.y0 = d.y; });
}

function toggle(d) {
  if (d.children) { d._children = d.children; d.children = null; }
  else             { d.children = d._children; d._children = null; }
}

function adjustColor(hex, alpha) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

function expandAll() {
  root.descendants().forEach(d => {
    if (d._children) { d.children = d._children; d._children = null; }
  });
  update(root);
}

function collapseAll() {
  root.descendants().forEach(d => {
    if (d.depth > 0 && d.children) { d._children = d.children; d.children = null; }
  });
  update(root);
}

function resetZoom() {
  svg.transition().duration(400).call(
    d3.zoom().transform,
    d3.zoomIdentity.translate(margin.left, margin.top)
  );
}

update(root);
</script>
</body>
</html>
